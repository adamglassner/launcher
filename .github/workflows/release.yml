# Builds Ironite Launcher and publishes it as a GitHub Release.
# Installed launchers check this repository's latest release and offer to
# update themselves, so every release must include IroniteLauncher-Setup-<version>.exe.
#
# To release: bump VERSION, add a section for it at the top of CHANGELOG.md and
# push to main. If that version has no release yet, this builds it and publishes
# v<version> (creating the tag). Pushes that don't change the version do nothing.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d ' \r\n' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"; echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip != 'true'
        with:
          go-version-file: launcher/go.mod
          cache: false

      - name: Install NSIS
        if: steps.check.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: bash build.sh

      - name: Release notes
        if: steps.check.outputs.skip != 'true'
        run: |
          awk 'BEGIN{n=0} /^## /{n++; if(n==2) exit} n==1 && !/^## /' CHANGELOG.md > notes.md
          printf '\n---\nInstalled launchers update themselves. New here? Download **IroniteLauncher-Setup-%s.exe** below and run it.\n' "${{ steps.check.outputs.version }}" >> notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ironite Launcher ${{ steps.check.outputs.version }}
          body_path: notes.md
          files: dist/IroniteLauncher-Setup-${{ steps.check.outputs.version }}.exe
          make_latest: true
